  <div id="failure" role="alert"><p>This little world needs WebGL and a connection to load Three.js. Try a current desktop browser, then reload the local HTTP page.</p></div>
  <noscript>This diorama requires JavaScript.</noscript>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    try {
      const TAU = Math.PI * 2;
      const LOOP_SECONDS = 30;
      let seed = 48271;
      const random = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) | 0;
        return (seed >>> 0) / 4294967296;
      };
      const range = (a, b) => a + (b - a) * random();
      const pick = values => values[Math.floor(random() * values.length)];
      const wrap = (n, d = 1) => ((n % d) + d) % d;
      const vec = (x, y, z) => new THREE.Vector3(x, y, z);
      const colorCache = new Map();
      const color = value => {
        if (value?.isColor) return value;
        if (!colorCache.has(value)) colorCache.set(value, new THREE.Color(value));
        return colorCache.get(value);
      };

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#070d18');
      scene.fog = new THREE.FogExp2('#0a1522', 0.0105);
      const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.08, 180);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.14;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.shadowMap.autoUpdate = false;
      renderer.domElement.setAttribute('aria-label', 'A living voxel night market in Shenzhen. Press C to orbit freely.');
      renderer.domElement.tabIndex = 0;
      document.body.prepend(renderer.domElement);

      const sky = new THREE.HemisphereLight('#7798c5', '#162130', 1.15);
      scene.add(sky);
      const moon = new THREE.DirectionalLight('#9ab8df', 2.15);
      moon.position.set(-15, 28, 15);
      moon.castShadow = true;
      moon.shadow.mapSize.set(2048, 2048);
      Object.assign(moon.shadow.camera, { left: -23, right: 23, top: 27, bottom: -20, near: 1, far: 75 });
      moon.shadow.bias = -0.00035;
      moon.shadow.normalBias = 0.045;
      moon.shadow.radius = 3;
      moon.target.position.set(0, 0, -1);
      scene.add(moon, moon.target);
      const rim = new THREE.DirectionalLight('#675ca0', 0.7);
      rim.position.set(10, 16, -18);
      scene.add(rim);
      const frontFill = new THREE.DirectionalLight('#537e91', 0.35);
      frontFill.position.set(0, 8, 20);
      scene.add(frontFill);

      const environmentScene = new THREE.Scene();
      const environmentBox = new THREE.Mesh(
        new THREE.BoxGeometry(90, 90, 90),
        new THREE.MeshBasicMaterial({ color: '#142038', side: THREE.BackSide })
      );
      environmentScene.add(environmentBox);
      const environmentPanels = [
        [0, 32, 0, 35, 1, 35, '#799aba', 1.1],
        [-24, 7, 0, 1, 12, 24, '#f09963', 1.2],
        [24, 9, -5, 1, 16, 15, '#2a9caa', 1.0],
        [0, 6, 27, 20, 8, 1, '#c95a55', 0.7]
      ];
      for (const [x, y, z, sx, sy, sz, tint, strength] of environmentPanels) {
        const panel = new THREE.Mesh(
          new THREE.BoxGeometry(sx, sy, sz),
          new THREE.MeshBasicMaterial({ color: color(tint).clone().multiplyScalar(strength) })
        );
        panel.position.set(x, y, z);
        environmentScene.add(panel);
      }
      const pmrem = new THREE.PMREMGenerator(renderer);
      const environment = pmrem.fromScene(environmentScene, 0.08);
      scene.environment = environment.texture;
      scene.environmentIntensity = 0.55;
      pmrem.dispose();
      environmentScene.traverse(object => {
        object.geometry?.dispose();
        object.material?.dispose();
      });

      const cube = new THREE.BoxGeometry(1, 1, 1);
      const matte = new THREE.MeshLambertMaterial({ color: 0xffffff });
      const metal = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.36, metalness: 0.7 });
      const road = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.24, metalness: 0.48, clearcoat: 0.85, clearcoatRoughness: 0.18, envMapIntensity: 0.75 });
      const wet = new THREE.MeshPhysicalMaterial({ color: '#172d39', roughness: 0.075, metalness: 0.72, clearcoat: 1, clearcoatRoughness: 0.07, transparent: true, opacity: 0.68, depthWrite: false, envMapIntensity: 1.35 });
      const emit = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
      const windows = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
      const lanternPaper = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65, emissive: '#ff751d', emissiveIntensity: 1.2 });
      const clockUniform = { value: 0 };
      const reflection = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.48, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
      reflection.onBeforeCompile = shader => {
        shader.uniforms.uMarketTime = clockUniform;
        shader.vertexShader = 'varying vec3 vPuddlePosition;\n' + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace('#include <project_vertex>', `
          #include <project_vertex>
          vec4 puddlePosition = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            puddlePosition = instanceMatrix * puddlePosition;
          #endif
          vPuddlePosition = (modelMatrix * puddlePosition).xyz;
        `);
        shader.fragmentShader = 'uniform float uMarketTime;\nvarying vec3 vPuddlePosition;\n' + shader.fragmentShader;
        shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `
          #include <color_fragment>
          vec2 p = vPuddlePosition.xz;
          float warp = sin(p.x * 15.0 + p.y * 2.3 + uMarketTime * 0.7);
          float broken = pow(0.5 + 0.5 * sin(p.y * 31.0 + warp * 1.8), 2.0);
          float ripple = 0.75 + 0.25 * sin(p.x * 22.0 - p.y * 17.0 + uMarketTime * 1.1);
          diffuseColor.a *= (0.22 + 0.78 * broken) * ripple;
        `);
      };
      reflection.customProgramCacheKey = () => 'voxel-puddle-reflection-v1';
      const flickers = [];
      function flickerMaterial(tint, strength, phase) {
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
        flickers.push({ material, base: color(tint).clone().multiplyScalar(strength), phase });
        return material;
      }
      const materials = {
        matte, metal, road, wet, emit, windows, lantern: lanternPaper, reflection,
        neonRose: flickerMaterial('#ff3f65', 3.3, 0.2),
        neonCyan: flickerMaterial('#40f5de', 2.6, 2.4),
        neonAmber: flickerMaterial('#ffaf51', 3.0, 4.8)
      };
      const buckets = new Map();
      const matrixObject = new THREE.Object3D();
      const obstacles = [];
      const staticMeshes = [];
      let staticVoxelCount = 0;

      function box(x, y, z, sx, sy, sz, tint = '#ffffff', kind = 'matte', rotation = null) {
        if (sx <= 0 || sy <= 0 || sz <= 0) return;
        if (!buckets.has(kind)) buckets.set(kind, []);
        buckets.get(kind).push({ x, y, z, sx, sy, sz, tint, rotation });
        staticVoxelCount++;
      }
      function obstacle(x, y, z, sx, sy, sz, name) {
        obstacles.push(new THREE.Box3(vec(x - sx / 2 - 0.12, y - sy / 2 - 0.12, z - sz / 2 - 0.12), vec(x + sx / 2 + 0.12, y + sy / 2 + 0.12, z + sz / 2 + 0.12)));
      }
      function localBox(origin, x, y, z, sx, sy, sz, tint, kind = 'matte', angle = 0) {
        const c = Math.cos(angle), s = Math.sin(angle);
        box(origin.x + c * x + s * z, origin.y + y, origin.z - s * x + c * z, sx, sy, sz, tint, kind, [0, angle, 0]);
      }
      function beam(a, b, thickness, tint = '#111b27', kind = 'metal') {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        const midpoint = a.clone().add(b).multiplyScalar(0.5);
        const quaternion = new THREE.Quaternion().setFromUnitVectors(vec(0, 1, 0), direction.normalize());
        const euler = new THREE.Euler().setFromQuaternion(quaternion);
        box(midpoint.x, midpoint.y, midpoint.z, thickness, length, thickness, tint, kind, [euler.x, euler.y, euler.z]);
      }
      function cable(a, b, sag, thickness = 0.035, tint = '#15212a', segments = 36) {
        let previous = a;
        for (let i = 1; i <= segments; i++) {
          const t = i / segments;
          const point = a.clone().lerp(b, t);
          point.y -= Math.sin(t * Math.PI) * sag;
          beam(previous, point, thickness, tint);
          previous = point;
        }
      }
      function buildBatches() {
        for (const [kind, instances] of buckets) {
          const mesh = new THREE.InstancedMesh(cube, materials[kind], instances.length);
          mesh.name = `static-${kind}`;
          for (let i = 0; i < instances.length; i++) {
            const item = instances[i];
            matrixObject.position.set(item.x, item.y, item.z);
            matrixObject.scale.set(item.sx, item.sy, item.sz);
            matrixObject.rotation.set(...(item.rotation || [0, 0, 0]));
            matrixObject.updateMatrix();
            mesh.setMatrixAt(i, matrixObject.matrix);
            mesh.setColorAt(i, color(item.tint));
          }
          mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
          mesh.instanceMatrix.needsUpdate = true;
          mesh.instanceColor.needsUpdate = true;
          mesh.castShadow = ['matte', 'metal', 'lantern'].includes(kind);
          mesh.receiveShadow = ['matte', 'metal', 'road', 'lantern'].includes(kind);
          mesh.computeBoundingSphere();
          scene.add(mesh);
          staticMeshes.push(mesh);
        }
      }

      const font = {
        A:['01110','11011','11011','11111','11011','11011','11011'],
        B:['11110','11011','11011','11110','11011','11011','11110'],
        C:['01111','11000','11000','11000','11000','11000','01111'],
        D:['11110','11011','11011','11011','11011','11011','11110'],
        E:['11111','11000','11000','11110','11000','11000','11111'],
        F:['11111','11000','11000','11110','11000','11000','11000'],
        G:['01111','11000','11000','11011','11011','11011','01111'],
        H:['11011','11011','11011','11111','11011','11011','11011'],
        I:['111','010','010','010','010','010','111'],
        J:['00111','00011','00011','00011','11011','11011','01110'],
        K:['11011','11010','11100','11100','11110','11011','11011'],
        L:['11000','11000','11000','11000','11000','11000','11111'],
        M:['10001','11011','11111','10101','10001','10001','10001'],
        N:['11001','11101','11101','11011','11011','11011','11001'],
        O:['01110','11011','11011','11011','11011','11011','01110'],
        P:['11110','11011','11011','11110','11000','11000','11000'],
        Q:['01110','11011','11011','11011','11111','01110','00011'],
        R:['11110','11011','11011','11110','11100','11010','11011'],
        S:['01111','11000','11000','01110','00011','00011','11110'],
        T:['11111','00100','00100','00100','00100','00100','00100'],
        U:['11011','11011','11011','11011','11011','11011','01110'],
        V:['11011','11011','11011','11011','11011','01110','00100'],
        W:['10001','10001','10101','10101','11111','11011','10001'],
        X:['11011','11011','01110','00100','01110','11011','11011'],
        Y:['11011','11011','11011','01110','00100','00100','00100'],
        Z:['11111','00011','00110','00100','01100','11000','11111'],
        '0':['01110','11011','11011','11011','11011','11011','01110'],
        '1':['010','110','010','010','010','010','111'],
        '2':['01110','11011','00011','00110','01100','11000','11111'],
        '3':['11110','00011','00011','01110','00011','00011','11110'],
        '4':['11011','11011','11011','11111','00011','00011','00011'],
        '5':['11111','11000','11000','11110','00011','00011','11110'],
        '6':['01111','11000','11000','11110','11011','11011','01110'],
        '7':['11111','00011','00011','00110','00110','01100','01100'],
        '8':['01110','11011','11011','01110','11011','11011','01110'],
        '9':['01110','11011','11011','01111','00011','00011','11110'],
        '+':['00000','00100','00100','11111','00100','00100','00000'],
        '-':['00000','00000','00000','11111','00000','00000','00000'],
        '.':['0','0','0','0','0','1','1'],
        '/':['00001','00011','00110','00100','01100','11000','10000']
      };
      const chinese = {
        '夜':['000100000','001111100','010101000','111111110','010101000','011111000','010110000','100101000','001001110'],
        '市':['000100000','111111111','000100000','011111110','010101010','010101010','010101010','000100000','000100000'],
        '小':['000100000','000100000','010100010','010100010','100100001','000100000','000100000','000100000','000100000'],
        '吃':['000000000','111001111','101001001','101001001','111001111','000001000','000001111','000001001','000000111'],
        '茶':['010000010','111111111','000100000','001010100','010101010','000100000','011111110','010101010','100100001'],
        '串':['000100000','011111110','010100010','011111110','000100000','011111110','010100010','011111110','000100000'],
        '深':['010011110','001010001','100011110','000010100','011111111','100010100','000111110','001010100','010010010'],
        '圳':['010001001','111101101','010101101','011101101','110101101','010101101','010101101','010101111','010001000']
      };
      function text(value, x, y, z, unit, tint, kind = 'emit', angle = 0) {
        const letters = [...value.toUpperCase()];
        const width = letters.reduce((sum, letter) => sum + ((font[letter]?.[0].length || 3) + 1) * unit, -unit);
        let cursor = -width / 2;
        const origin = vec(x, y, z);
        for (const letter of letters) {
          const glyph = font[letter];
          if (!glyph) { cursor += unit * 4; continue; }
          for (let row = 0; row < glyph.length; row++) {
            for (let col = 0; col < glyph[row].length; col++) {
              if (glyph[row][col] === '1') {
                localBox(origin, cursor + (col + 0.5) * unit, (3 - row) * unit, 0, unit * 0.88, unit * 0.88, unit * 0.48, tint, kind, angle);
              }
            }
          }
          cursor += (glyph[0].length + 1) * unit;
        }
      }
      function glyph(value, x, y, z, unit, tint, kind = 'emit', angle = 0) {
        const pattern = chinese[value];
        if (!pattern) return;
        const origin = vec(x, y, z);
        for (let row = 0; row < 9; row++) {
          for (let col = 0; col < 9; col++) {
            if (pattern[row][col] === '1') localBox(origin, (col - 4) * unit, (4 - row) * unit, 0, unit * 0.94, unit * 0.94, unit * 0.55, tint, kind, angle);
          }
        }
      }
      function sign(label, x, y, z, width, height, unit, tint, kind = 'emit', angle = 0) {
        localBox(vec(x, y, z), 0, 0, 0, width, height, 0.18, '#101a24', 'metal', angle);
        localBox(vec(x, y, z), 0, height / 2, 0.03, width + 0.08, 0.045, 0.055, tint, kind, angle);
        localBox(vec(x, y, z), 0, -height / 2, 0.03, width + 0.08, 0.045, 0.055, tint, kind, angle);
        localBox(vec(x, y, z), -width / 2, 0, 0.03, 0.045, height, 0.055, tint, kind, angle);
        localBox(vec(x, y, z), width / 2, 0, 0.03, 0.045, height, 0.055, tint, kind, angle);
        text(label, x, y, z + 0.13, unit, kind === 'emit' ? color(tint).clone().multiplyScalar(3.0) : '#ffffff', kind, angle);
      }
      function pointLight(x, y, z, tint, intensity, distance) {
        const light = new THREE.PointLight(tint, intensity, distance, 2);
        light.position.set(x, y, z);
        scene.add(light);
        return light;
      }
      function lantern(x, y, z, scale = 1) {
        const c = '#ff843c';
        box(x, y, z, 0.55 * scale, 0.5 * scale, 0.55 * scale, c, 'lantern');
        box(x, y + 0.19 * scale, z, 0.44 * scale, 0.18 * scale, 0.44 * scale, '#ff9c46', 'lantern');
        box(x, y - 0.21 * scale, z, 0.44 * scale, 0.12 * scale, 0.44 * scale, '#ff9a40', 'lantern');
        box(x, y, z, 0.4 * scale, 0.42 * scale, 0.575 * scale, color('#ffb44f').clone().multiplyScalar(1.8), 'emit');
        for (const side of [-1, 1]) {
          box(x + side * 0.25 * scale, y, z, 0.035 * scale, 0.51 * scale, 0.58 * scale, '#b93721');
          box(x, y, z + side * 0.25 * scale, 0.58 * scale, 0.51 * scale, 0.035 * scale, '#c13e23');
        }
        box(x, y + 0.34 * scale, z, 0.31 * scale, 0.08 * scale, 0.31 * scale, '#62261f');
        box(x, y - 0.32 * scale, z, 0.27 * scale, 0.08 * scale, 0.27 * scale, '#7b2922');
        box(x, y - 0.48 * scale, z, 0.045 * scale, 0.27 * scale, 0.045 * scale, '#e15830');
        box(x, y + 0.52 * scale, z, 0.035 * scale, 0.28 * scale, 0.035 * scale, '#28242b', 'metal');
      }

      box(0, -0.64, 0, 28.2, 1.18, 23, '#101c29', 'metal');
      box(0, -1.23, 0, 27.8, 0.12, 22.6, '#070f1b');
      box(0, -0.1, 0, 27.8, 0.1, 22.6, '#1b2932', 'road');
      for (let ix = 0; ix < 46; ix++) {
        for (let iz = 0; iz < 37; iz++) {
          const x = -13.5 + ix * 0.6;
          const z = -10.8 + iz * 0.6;
          const isRoad = Math.abs(x) < 2.7 || z > 7.0;
          const palette = isRoad ? ['#202d35', '#24333b', '#1e2d36', '#293a42', '#22323a'] : ['#3b4449', '#424a4b', '#37444a', '#434a49', '#354047'];
          box(x, isRoad ? -0.013 : 0.045, z, 0.58, isRoad ? 0.095 : 0.17, 0.58, pick(palette), isRoad ? 'road' : 'matte');
          if (isRoad && random() < 0.13) box(x + range(-0.1, 0.1), 0.039, z, range(0.2, 0.5), 0.008, range(0.12, 0.45), '#142b37', 'wet');
        }
      }
      for (let ix = 0; ix < 47; ix++) {
        for (const side of [-1, 1]) {
          box(-13.8 + ix * 0.6, -0.56, side * 11.48, 0.57, 0.48, 0.12, pick(['#21303a', '#28363c', '#1b2a36']));
        }
      }
      for (let iz = 0; iz < 38; iz++) {
        for (const side of [-1, 1]) box(side * 14.08, -0.56, -11.1 + iz * 0.6, 0.12, 0.48, 0.57, pick(['#21303a', '#28363c', '#1b2a36']));
      }
      box(0, -0.85, 11.56, 5.5, 0.3, 0.06, '#0e1a25');
      text('SHENZHEN  22:48', 0, -0.83, 11.603, 0.043, color('#73afbd').clone().multiplyScalar(1.15), 'emit');
      for (const side of [-1, 1]) {
        for (let z = -6.5; z < 7; z += 0.6) box(side * 2.87, 0.095, z, 0.18, 0.2, 0.57, '#69716b');
        for (let x = 3.1; x < 13.2; x += 0.6) box(side * x, 0.095, 7.05, 0.56, 0.18, 0.16, '#69716b');
      }
      for (let x = -2.35; x <= 2.4; x += 0.52) box(x, 0.048, 7.65, 0.28, 0.018, 1.05, '#84918a', 'road');
      for (let z = -5.7; z < 6.6; z += 1.8) box(0, 0.042, z, 0.065, 0.012, 0.48, '#8e8160', 'road');

      function building({ x, z, w, d, h, tint, shop = false }) {
        box(x, h / 2 + 0.13, z, w, h, d, tint);
        obstacle(x, h / 2 + 0.13, z, w, h, d, 'building');
        box(x, 0.4, z, w + 0.22, 0.5, d + 0.22, '#172a34');
        const floors = Math.max(2, Math.floor((h - 1.2) / 1.65));
        const floorHeight = (h - 1.0) / floors;
        for (let floor = 0; floor < floors; floor++) {
          const y = 1.65 + floor * floorHeight;
          box(x, y - 0.79, z, w + 0.1, 0.07, d + 0.1, '#3e4d54');
          for (const face of [0, 1, 2, 3]) {
            const span = face % 2 === 0 ? w : d;
            const count = Math.max(2, Math.floor(span / 1.05));
            for (let col = 0; col < count; col++) {

          const visibility = Math.pow(Math.sin(age * Math.PI), 1.4);
          const size = (0.10 + age * 0.47) * Math.max(0.08, visibility);
          const drift = particle.smoke ? 0.85 : 0.4;
          matrixObject.position.set(
            particle.source.x + Math.sin(age * 4.5 + particle.seed * TAU) * age * 0.3 + age * drift,
            particle.source.y + age * (particle.smoke ? 2.65 : 2.05),
            particle.source.z + Math.cos(age * particle.sway + particle.seed * 3) * age * 0.24
          );
          matrixObject.rotation.set(age * 0.7, particle.seed * 3 + age, age * 0.35);
          matrixObject.scale.set(size * 1.15, size * 0.83, size);
          matrixObject.updateMatrix();
          steamMesh.setMatrixAt(i, matrixObject.matrix);
          steamMesh.setColorAt(i, particle.smoke ? steamDark : steamLight);
          steamAlpha.setX(i, visibility * (particle.smoke ? 0.45 : 1));
        }
        steamMesh.instanceMatrix.needsUpdate = true;
        steamMesh.instanceColor.needsUpdate = true;
        steamAlpha.needsUpdate = true;
        for (let i = 0; i < dripCount; i++) {
          const drip = drips[i];
          const age = wrap(drip.phase + time * 0.8);
          matrixObject.position.set(drip.x, 0.12 + age * drip.height, drip.z);
          matrixObject.rotation.set(0, 0, 0);
          matrixObject.scale.set(0.013, 0.085, 0.013);
          matrixObject.updateMatrix();
          dripMesh.setMatrixAt(i, matrixObject.matrix);
        }
        dripMesh.instanceMatrix.needsUpdate = true;
        for (let i = 0; i < 14; i++) {
          const age = wrap(i / 14 + time / 3);
          const radius = 0.06 + age * 0.53;
          const opacity = Math.max(0.001, 1 - age);
          const x = Math.sin(i * 12.37) * 2.1;
          const z = wrap(i * 3.71, 14) - 5.4;
          for (let side = 0; side < 4; side++) {
            matrixObject.position.set(x + (side < 2 ? (side ? 1 : -1) * radius : 0), 0.066, z + (side >= 2 ? (side === 3 ? 1 : -1) * radius : 0));
            matrixObject.rotation.set(0, 0, 0);
            matrixObject.scale.set(side < 2 ? 0.012 : radius * 2, 0.006, side < 2 ? radius * 2 : 0.012);
            matrixObject.updateMatrix();
            const index = i * 4 + side;
            rippleMesh.setMatrixAt(index, matrixObject.matrix);
            rippleMesh.setColorAt(index, new THREE.Color(opacity, opacity, opacity));
          }
        }
        rippleMesh.instanceMatrix.needsUpdate = true;
        rippleMesh.instanceColor.needsUpdate = true;
        for (let i = 0; i < 20; i++) {
          const age = wrap(i / 20 + time / 2);
          const size = Math.sin(age * Math.PI) * 0.033;
          matrixObject.position.set(4.23 + Math.sin(i * 5.3 + age * 3) * age * 0.33, 1.7 + age * 1.45, -4.0 + Math.cos(i * 3.5 + age * 2) * age * 0.33);
          matrixObject.rotation.set(age * 3, age * 2, 0);
          matrixObject.scale.setScalar(Math.max(0.001, size));
          matrixObject.updateMatrix();
          emberMesh.setMatrixAt(i, matrixObject.matrix);
        }
        emberMesh.instanceMatrix.needsUpdate = true;
        for (const flicker of flickers) {
          const wave = Math.sin(time * TAU / 30 * 67 + flicker.phase) * Math.sin(time * TAU / 30 * 113 + flicker.phase * 4);
          const dip = wave > 0.93 ? 0.58 : 1;
          flicker.material.color.copy(flicker.base).multiplyScalar((0.96 + 0.04 * Math.sin(time * TAU / 30 * 23 + flicker.phase)) * dip);
        }
      }

      const cameraPoints = [
        vec(29, 24, 36), vec(13, 10.5, 21), vec(2.0, 3.25, 10.3), vec(-0.75, 2.7, 3.5),
        vec(0.3, 3.15, -0.4), vec(0, 8.0, -5.5), vec(-10, 11, 8), vec(-19, 15, 19),
        vec(-9, 26, 34), vec(15, 26, 35)
      ];
      const targetPoints = [
        vec(0, 6.5, 0), vec(0, 3.0, 1), vec(0, 2.0, 0), vec(3.5, 1.65, 0.1),
        vec(-3.4, 2.1, -3.2), vec(1.0, 6.0, -9), vec(0, 3.0, 0), vec(0, 5.0, 0),
        vec(0, 6.0, 0), vec(0, 6.0, 0)
      ];
      const cameraPath = new THREE.CatmullRomCurve3(cameraPoints, true, 'centripetal');
      const targetPath = new THREE.CatmullRomCurve3(targetPoints, true, 'centripetal');
      const cameraTarget = new THREE.Vector3();
      const fovs = [49, 47, 55, 56, 55, 52, 49, 49, 49, 49];
      function cameraAt(time) {
        const u = wrap(time / LOOP_SECONDS);
        const position = cameraPath.getPoint(u);
        const target = targetPath.getPoint(u);
        const segment = Math.floor(u * fovs.length);
        const blend = wrap(u * fovs.length);
        const eased = blend * blend * (3 - 2 * blend);
        const fov = THREE.MathUtils.lerp(fovs[segment], fovs[(segment + 1) % fovs.length], eased);
        return { position, target, fov };
      }
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.rotateSpeed = 0.55;
      controls.panSpeed = 0.65;
      controls.minDistance = 3;
      controls.maxDistance = 75;
      controls.minPolarAngle = 0.15;
      controls.maxPolarAngle = Math.PI * 0.485;
      controls.target.set(0, 3, 0);
      controls.enabled = false;
      let mode = 'cinematic';
      const orbitHelp = document.getElementById('orbit-help');
      function setCamera(time) {
        const pose = cameraAt(time);
        camera.position.copy(pose.position);
        cameraTarget.copy(pose.target);
        camera.fov = pose.fov;
        camera.updateProjectionMatrix();
        camera.lookAt(cameraTarget);
      }
      function toggleCamera() {
        if (mode === 'cinematic') {
          mode = 'orbit';
          const direction = new THREE.Vector3();
          camera.getWorldDirection(direction);
          controls.target.copy(camera.position).addScaledVector(direction, 8);
          controls.enabled = true;
          controls.update();
          orbitHelp.classList.add('visible');
          orbitHelp.setAttribute('aria-hidden', 'false');
        } else {
          mode = 'cinematic';
          controls.enabled = false;
          orbitHelp.classList.remove('visible');
          orbitHelp.setAttribute('aria-hidden', 'true');
        }
      }
      window.addEventListener('keydown', event => {
        if (event.code === 'KeyC' && !event.repeat && !event.ctrlKey && !event.metaKey && !event.altKey) {
          event.preventDefault();
          toggleCamera();
        }
      });

      const renderTarget = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: Math.min(4, renderer.capabilities.maxSamples) });
      const composer = new EffectComposer(renderer, renderTarget);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.53, 0.64, 1.0);
      composer.addPass(bloom);
      const grade = new ShaderPass({
        uniforms: { tDiffuse: { value: null } },
        vertexShader: `varying vec2 vUv;
          void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
          void main() {
            vec3 c = texture2D(tDiffuse, vUv).rgb;
            float luminance = dot(c, vec3(0.2126, 0.7152, 0.0722));
            c = mix(vec3(luminance), c, 1.075);
            vec2 q = (vUv - 0.5) * vec2(1.0, 0.86);
            c *= 1.0 - smoothstep(0.24, 0.69, length(q)) * 0.32;
            gl_FragColor = vec4(max(c, 0.0), 1.0);
          }`
      });
      composer.addPass(grade);
      composer.addPass(new OutputPass());

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
      });
      renderer.domElement.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        document.getElementById('failure').style.display = 'grid';
      });

      let elapsed = 0;
      let previous = performance.now();
      let frozenTime = null;
      let frameMilliseconds = 16.7;
      let frames = 0;
      let ready = false;
      function draw(time) {
        clockUniform.value = time;
        updateLife(time);
        if (mode === 'cinematic') setCamera(time);
        else controls.update();
        composer.render();
        frames++;
      }
      setCamera(0);
      updateLife(0);
      composer.render();
      ready = true;
      function animate(now) {
        requestAnimationFrame(animate);
        const delta = Math.max(0, (now - previous) / 1000);
        previous = now;
        if (delta > 0 && delta < 1) {
          frameMilliseconds = frameMilliseconds * 0.95 + delta * 1000 * 0.05;
          if (frozenTime === null) elapsed += delta;
        }
        const time = frozenTime ?? elapsed;
        if (!document.hidden) draw(time);
      }
      requestAnimationFrame(animate);

      window.__market = Object.freeze({
        get ready() { return ready; },
        getState: () => ({
          ready, mode, elapsed, loopTime: wrap(elapsed, LOOP_SECONDS), period: LOOP_SECONDS, frames,
          frameMilliseconds, drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles,
          staticVoxels: staticVoxelCount, dynamicVoxels: dynamicVoxelCount, actors: actors.length,
          camera: { position: camera.position.toArray(), target: cameraTarget.toArray(), fov: camera.fov },
          hintVisible: orbitHelp.classList.contains('visible'), pixelRatio: renderer.getPixelRatio(),
          viewport: [innerWidth, innerHeight]
        }),
        seek: seconds => {
          frozenTime = Number(seconds) || 0;
          draw(frozenTime);
          return window.__market.getState();
        },
        resume: () => { elapsed = frozenTime ?? elapsed; frozenTime = null; previous = performance.now(); },
        cameraAt: seconds => {
          const pose = cameraAt(seconds);
          return { position: pose.position.toArray(), target: pose.target.toArray(), fov: pose.fov };
        },
        checkCamera: () => {
          const hits = [];
          let minimumTargetDistance = Infinity;
          for (let i = 0; i <= 1500; i++) {
            const time = i / 1500 * LOOP_SECONDS;
            const pose = cameraAt(time);
            minimumTargetDistance = Math.min(minimumTargetDistance, pose.position.distanceTo(pose.target));
            obstacles.forEach((bounds, index) => {
              if (bounds.containsPoint(pose.position)) hits.push({ time, obstacle: index });
            });
          }
          const start = cameraAt(0), end = cameraAt(LOOP_SECONDS);
          return { hits, minimumTargetDistance, seamPositionError: start.position.distanceTo(end.position), seamTargetError: start.target.distanceTo(end.target), geometryTypes: [...new Set(scene.children.filter(o => o.isMesh).map(o => o.geometry.type))] };
        }
      });
    } catch (error) {
      console.error('The night market could not start:', error);
      document.getElementById('failure').style.display = 'grid';
    }
  </script>
  <script>
    window.addEventListener('error', function (event) {
      if (event.message && /WebGL|module|fetch|network/i.test(event.message)) document.getElementById('failure').style.display = 'grid';
    });
  </script>
</body>
</html>
